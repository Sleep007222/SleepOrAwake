<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="calendar.css">
        <title>For Sam</title>
    </head>

    <body>
        <div class="box">
        <header>
            <h2 style="color: rgb(27, 65, 22);">Testing for the website</h2>
        </header>
        <nav>
            <h2 style="color: rgb(27, 65, 22);">Navigation</h2>
            <ul>
                <li><a href="index.html">Letters</a></li>
                <li><a href="Calander.html">Calander</a></li>
                <li><a href="List.html">List of things</a></li>
            </ul>
        </nav>
        <main>
            <div class="calendar-app">
              <div class="left">
                <div class="calendar">
                  <div class="month">
                    <i class="fas fa-angle-left prev"></i>
                    <div class="date">december 2015</div>
                    <i class="fas fa-angle-right next"></i>
                  </div>
                  <div class="weekdays">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
                    <div>Thu</div><div>Fri</div><div>Sat</div>
                  </div>
                  <div class="days"></div>
                  <div class="goto-today">
                    <div class="goto">
                      <input type="text" placeholder="mm/yyyy" class="date-input" />
                      <button class="goto-btn">Go</button>
                    </div>
                    <button class="today-btn">Today</button>
                  </div>
                </div>
              </div>

              <div class="right">
                <div class="today-date">
                  <div class="event-day">wed</div>
                  <div class="event-date">12th december 2022</div>
                </div>
                <div class="events"></div>
                <div class="add-event-wrapper">
                  <div class="add-event-header">
                    <div class="title">Add Event</div>
                    <i class="fas fa-times close"></i>
                  </div>
                  <div class="add-event-body">
                    <div class="add-event-input">
                      <input type="text" placeholder="Event Name" class="event-name" />
                    </div>
                    <div class="add-event-input">
                      <input type="text" placeholder="Event Time From" class="event-time-from" />
                    </div>
                    <div class="add-event-input">
                      <input type="text" placeholder="Event Time To" class="event-time-to" />
                    </div>
                  </div>
                  <div class="add-event-footer">
                    <button class="add-event-btn">Add Event</button>
                  </div>
                </div>
              </div>

              <button class="add-event">
                <i class="fas fa-plus"></i>
              </button>
            </div>
        </main>
        <footer>Footer</footer>
        </div>

        <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
        <script src="calendar.js"></script>
    </body>
</html>
