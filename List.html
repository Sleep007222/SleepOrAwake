<!DOCTYPE html>
<html lang="en">

        <link rel="stylesheet" href="style.css">

        <title>For Sam</title>

    <body>
        <div class="box">
        <header>
            <h2 style="color: rgb(27, 65, 22);">Testing for the website</h2>
        </header>
        <nav>
            <h2>Navigation</h2>
            <ul>

            </ul>

        <main>
            <div class="list-app">
                <h2>Our List</h2>

                <form id="add-form" autocomplete="off">
                    <input type="text" id="new-item" placeholder="Add something..." maxlength="100">
                    <button type="submit">Add</button>

                <p id="status">Loading...</p>
                <ul id="items"></ul>

                <button id="clear-done" type="button">Clear checked items</button>
            </div>
        </main>
        <footer>Footer</footer>
        </div>
