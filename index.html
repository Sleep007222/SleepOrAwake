<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>For Sam</title>
    </head>

    <body>
        <div class="box">
        <header>
            <h2 style="color: rgb(27, 65, 22);">Sleep Or Awake</h2>
        </header>
        <nav>
            <h2 style="color: rgb(27, 65, 22);">Navigation</h2>
            <ul>
                <li><a href="index.html">Letters</a></li>
                <li><a href="Calander.html">Calander</a></li>
                <li><a href="List.html">Handy List</a></li>
            </ul>
        </nav>
        <main>
            <h2 style="color: rgb(27, 65, 22);">Letters to Open</h2>
            <p>Welcome! This is a test writing for the website :3 So ignore what I am writing on this website, Chuddy chud chud</p>

            <div class="letters">

                <div class="letter">
                    <button class="open-button" data-popup-target="#popup">
                        <img src="Letter.png" alt="Open letter">
                    </button>
                    <p class="letter-label">First Letter of Many</p>
                    <p class="letter-date">Oct 5, 2026</p>
                </div>

                <!-- To add another letter, copy the whole <div class="letter"> block above,
                     change the popup number (#popup2), the name, and the date.
                     Then add a matching popup with id="popup2" below. -->

            </div>
        </main>
        <footer>Footer</footer>
        </div>


        <div class="popup" id="popup">
            <div class="popup-header">
                <div class="title">For Sam</div>
                <button data-close-button class="close-button">&times;</button>
            </div>
            <div class="popup-body">
                <img src="Testing.png" alt="Letter page 1">
                <img src="Testing_2.png" alt="Letter page 2">
            </div>
        </div>

        <div id="overlay"></div>

        <script src="script.js"></script>
    </body>
</html>
